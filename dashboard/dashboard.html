<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROADSTATE — Live Pothole Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #16181c;
    --panel: #1f2227;
    --panel-raised: #262a30;
    --hairline: #34383f;
    --chalk: #eeece2;
    --slate: #8b92a0;
    --slate-dim: #5c626e;
    --safety-yellow: #ffc933;
    --severe: #e8542e;
    --moderate: #f2a93c;
    --minor: #4fae7c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--asphalt);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Layout ---------- */
  #app {
    display: grid;
    grid-template-rows: auto auto 1fr;
    height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--panel);
    border-bottom: 3px solid var(--safety-yellow);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 18px, rgba(255,201,51,0.035) 18px, rgba(255,201,51,0.035) 36px
    );
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; flex-shrink: 0;
  }
  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.04em;
    margin: 0;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .brand .sub {
    font-size: 11px;
    color: var(--slate);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .conn-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--slate);
    padding: 6px 12px;
    background: var(--panel-raised);
    border-radius: 20px;
    border: 1px solid var(--hairline);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--slate-dim); flex-shrink:0; }
  .dot.live { background: var(--minor); box-shadow: 0 0 0 0 rgba(79,174,124,0.6); animation: pulse 2s infinite; }
  .dot.demo { background: var(--safety-yellow); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,174,124,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(79,174,124,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,174,124,0); }
  }

  /* ---------- Stat strip ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--asphalt);
    border-bottom: 1px solid var(--hairline);
  }
  .stat {
    padding: 14px 24px;
    border-right: 1px solid var(--hairline);
  }
  .stat:last-child { border-right: none; }
  .stat .label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--slate-dim); margin-bottom: 4px;
  }
  .stat .value {
    font-family: 'Oswald', sans-serif;
    font-size: 28px; font-weight: 600;
    line-height: 1;
    color: var(--chalk);
  }
  .stat .value.severe-num { color: var(--severe); }
  .stat .value.moderate-num { color: var(--moderate); }
  .stat .value.minor-num { color: var(--minor); }

  /* ---------- Main grid ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    min-height: 0;
  }

  #map { width: 100%; height: 100%; background: #0d0e10; }

  /* Leaflet dark tuning */
  .leaflet-container { background: #0d0e10; }
  .leaflet-control-attribution {
    background: rgba(22,24,28,0.75) !important;
    color: var(--slate-dim) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--slate) !important; }
  .leaflet-control-zoom a {
    background: var(--panel-raised) !important;
    color: var(--chalk) !important;
    border-color: var(--hairline) !important;
  }

  /* ---------- Side panel ---------- */
  #side {
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .side-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .side-header .title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--chalk);
    margin-bottom: 10px;
  }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--hairline);
    background: var(--panel-raised);
    color: var(--slate);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
    letter-spacing: 0.02em;
  }
  .chip:hover { border-color: var(--slate-dim); }
  .chip.active { background: var(--safety-yellow); color: #16181c; border-color: var(--safety-yellow); font-weight: 600; }
  .chip.sev-severe.active { background: var(--severe); color: white; border-color: var(--severe); }
  .chip.sev-moderate.active { background: var(--moderate); color: #16181c; border-color: var(--moderate); }
  .chip.sev-minor.active { background: var(--minor); color: #16181c; border-color: var(--minor); }

  #feed {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #feed::-webkit-scrollbar { width: 6px; }
  #feed::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

  .report {
    padding: 12px 18px;
    border-bottom: 1px solid var(--hairline);
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .report:hover { background: var(--panel-raised); }
  .report.highlight { background: var(--panel-raised); }

  .sev-icon { width: 34px; height: 26px; margin-top: 2px; }

  .report .row1 {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .report .address {
    font-size: 13px; color: var(--chalk); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .report .ago { font-size: 10px; color: var(--slate-dim); flex-shrink: 0; }
  .report .meta {
    font-size: 11px; color: var(--slate);
    display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap;
  }
  .report .meta .badge {
    padding: 1px 6px; border-radius: 3px; background: var(--panel-raised);
    border: 1px solid var(--hairline);
  }
  .report .status-row {
    margin-top: 8px; display: flex; gap: 6px;
  }
  .status-btn {
    font-size: 10px; padding: 4px 8px; border-radius: 4px;
    background: transparent; border: 1px solid var(--hairline);
    color: var(--slate); cursor: pointer; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .status-btn:hover { border-color: var(--safety-yellow); color: var(--safety-yellow); }
  .status-btn.current { background: var(--safety-yellow); color: #16181c; border-color: var(--safety-yellow); font-weight: 600; }

  .empty-state {
    padding: 60px 24px; text-align: center; color: var(--slate-dim);
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }
  .empty-state .msg { font-size: 13px; }

  .marker-pop {
    font-family: 'Inter', sans-serif;
    color: #16181c;
  }
  .marker-pop b { font-family: 'Oswald', sans-serif; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 30 Q 16 26, 20 30 Q 24 34, 28 30 Q 32 26, 44 30" stroke="#eeece2" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="24" cy="31.5" rx="6.5" ry="3" fill="#ffc933"/>
        <path d="M4 30 L4 22 M44 30 L44 22" stroke="#5c626e" stroke-width="2" stroke-dasharray="3 3"/>
      </svg>
      <div>
        <h1>Roadstate</h1>
        <div class="sub">Live Pothole Detection &amp; Reporting — Municipal Console</div>
      </div>
    </div>
    <div id="conn-status" class="conn-status">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-text">Connecting…</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Open Reports</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat">
      <div class="label">Severe</div>
      <div class="value severe-num" id="stat-severe">—</div>
    </div>
    <div class="stat">
      <div class="label">Moderate</div>
      <div class="value moderate-num" id="stat-moderate">—</div>
    </div>
    <div class="stat">
      <div class="label">Minor</div>
      <div class="value minor-num" id="stat-minor">—</div>
    </div>
    <div class="stat">
      <div class="label">Reporting Vehicles</div>
      <div class="value" id="stat-vehicles">—</div>
    </div>
  </div>

  <main>
    <div id="map"></div>
    <div id="side">
      <div class="side-header">
        <div class="title">Live Feed</div>
        <div class="filters" id="filters">
          <div class="chip active" data-sev="all">All</div>
          <div class="chip sev-severe" data-sev="severe">Severe</div>
          <div class="chip sev-moderate" data-sev="moderate">Moderate</div>
          <div class="chip sev-minor" data-sev="minor">Minor</div>
        </div>
      </div>
      <div id="feed"></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
// Point this at your running backend (see /backend/app.py).
// If it's unreachable (e.g. previewing this file standalone),
// the dashboard falls back to a generated demo dataset so the
// UI is still fully explorable.
const API_BASE = "http://localhost:5000";
const POLL_INTERVAL_MS = 4000;
const CITY_CENTER = [8.5241, 76.9366]; // Thiruvananthapuram, as a default demo city

const SEVERITY_COLORS = { minor: "#4fae7c", moderate: "#f2a93c", severe: "#e8542e" };
let currentFilter = "all";
let demoMode = false;
let detections = [];
let markers = {};

/* ============================================================
   MAP SETUP
   ============================================================ */
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView(CITY_CENTER, 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
  subdomains: ['a', 'b', 'c'],
  maxZoom: 19,
  className: 'dark-osm-tile-layer'
}).addTo(map);

function potholeIconSvg(severity) {
  const color = SEVERITY_COLORS[severity] || "#8b92a0";
  return `
    <svg width="30" height="24" viewBox="0 0 30 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 16 Q 8 12, 11 16 Q 15 20, 19 16 Q 22 12, 29 16" stroke="#eeece2" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="15" cy="16.5" rx="4.5" ry="2.2" fill="${color}" stroke="#16181c" stroke-width="1"/>
    </svg>`;
}

function makeIcon(severity) {
  return L.divIcon({
    html: potholeIconSvg(severity),
    className: 'pothole-marker',
    iconSize: [30, 24],
    iconAnchor: [15, 16],
  });
}

/* ============================================================
   DATA FETCHING
   ============================================================ */
async function fetchDetections() {
  const res = await fetch(`${API_BASE}/api/detections?limit=300`, { signal: AbortSignal.timeout(3000) });
  if (!res.ok) throw new Error('bad response');
  return res.json();
}

async function fetchStats() {
  const res = await fetch(`${API_BASE}/api/stats`, { signal: AbortSignal.timeout(3000) });
  if (!res.ok) throw new Error('bad response');
  return res.json();
}

async function patchStatus(id, status) {
  try {
    await fetch(`${API_BASE}/api/detections/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
  } catch (e) { /* demo mode / offline — update locally only */ }
  const d = detections.find(x => x.id === id);
  if (d) d.status = status;
  render();
}

/* ============================================================
   DEMO DATA (used only if the backend can't be reached)
   ============================================================ */
function generateDemoData() {
  const hotspots = [
    [8.5241, 76.9366], [8.4855, 76.9492], [8.5459, 76.9109], [8.5010, 76.9500], [8.5620, 76.9215]
  ];
  const vehicles = ['bus-042', 'bus-017', 'car-118', 'car-104', 'bus-003'];
  const sevPool = ['minor','minor','moderate','minor','severe','moderate','severe','minor'];
  const out = [];
  let n = 0;
  hotspots.forEach((hs, hi) => {
    const clusterSize = 2 + (hi % 3);
    for (let i = 0; i < clusterSize; i++) {
      n++;
      const sev = sevPool[n % sevPool.length];
      out.push({
        id: `demo-${n}`,
        vehicle_id: vehicles[n % vehicles.length],
        latitude: hs[0] + (Math.random() - 0.5) * 0.002,
        longitude: hs[1] + (Math.random() - 0.5) * 0.002,
        severity: sev,
        est_depth_cm: sev === 'severe' ? +(5 + Math.random()*3).toFixed(1) : sev === 'moderate' ? +(2.5 + Math.random()*2).toFixed(1) : +(0.5 + Math.random()*1.8).toFixed(1),
        confidence: +(0.65 + Math.random()*0.3).toFixed(2),
        timestamp: (Date.now()/1000) - Math.random() * 3600 * 6,
        status: ['reported','reported','acknowledged','scheduled'][n % 4],
        report_count: 1 + (i === 0 ? Math.floor(Math.random()*4) : 0),
        address: `Demo Ward ${hi+1}, near hotspot ${hi+1}`,
      });
    }
  });
  return out;
}

function computeDemoStats(data) {
  const open = data.filter(d => d.status !== 'repaired');
  const bySev = {};
  open.forEach(d => bySev[d.severity] = (bySev[d.severity]||0) + 1);
  return {
    total_reports: data.length,
    active_vehicles: new Set(data.map(d=>d.vehicle_id)).size,
    open_by_severity: bySev,
  };
}

/* ============================================================
   RENDERING
   ============================================================ */
function timeAgo(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function renderStats(stats) {
  document.getElementById('stat-total').textContent = stats.total_reports ?? '—';
  document.getElementById('stat-vehicles').textContent = stats.active_vehicles ?? '—';
  const bySev = stats.open_by_severity || {};
  document.getElementById('stat-severe').textContent = bySev.severe ?? 0;
  document.getElementById('stat-moderate').textContent = bySev.moderate ?? 0;
  document.getElementById('stat-minor').textContent = bySev.minor ?? 0;
}

function renderMarkers(data) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  data.forEach(d => {
    if (currentFilter !== 'all' && d.severity !== currentFilter) return;
    const marker = L.marker([d.latitude, d.longitude], { icon: makeIcon(d.severity) }).addTo(map);
    marker.bindPopup(`
      <div class="marker-pop">
        <b>${d.severity.toUpperCase()}</b> pothole<br/>
        Depth est. ${d.est_depth_cm} cm<br/>
        Reported ${d.report_count || 1}× · ${d.address || ''}<br/>
        Status: ${d.status}
      </div>
    `);
    markers[d.id] = marker;
  });
}

function renderFeed(data) {
  const feed = document.getElementById('feed');
  const filtered = currentFilter === 'all' ? data : data.filter(d => d.severity === currentFilter);
  const sorted = [...filtered].sort((a,b) => b.timestamp - a.timestamp);

  if (sorted.length === 0) {
    feed.innerHTML = `<div class="empty-state"><div class="icon">🛣️</div><div class="msg">No reports match this filter.</div></div>`;
    return;
  }

  feed.innerHTML = sorted.map(d => `
    <div class="report" data-id="${d.id}">
      <svg class="sev-icon" viewBox="0 0 30 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 16 Q 8 12, 11 16 Q 15 20, 19 16 Q 22 12, 29 16" stroke="#5c626e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="15" cy="16.5" rx="4.5" ry="2.2" fill="${SEVERITY_COLORS[d.severity]}" stroke="#16181c" stroke-width="1"/>
      </svg>
      <div>
        <div class="row1">
          <div class="address">${d.address || `${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)}`}</div>
          <div class="ago mono">${timeAgo(d.timestamp)}</div>
        </div>
        <div class="meta">
          <span class="badge mono">${d.severity}</span>
          <span class="badge mono">${d.est_depth_cm}cm</span>
          <span class="badge mono">${d.vehicle_id}</span>
          ${d.report_count > 1 ? `<span class="badge mono">×${d.report_count}</span>` : ''}
        </div>
        <div class="status-row">
          ${['reported','acknowledged','scheduled','repaired'].map(s => `
            <button class="status-btn ${d.status === s ? 'current' : ''}" data-id="${d.id}" data-status="${s}">${s}</button>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');

  feed.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      patchStatus(btn.dataset.id, btn.dataset.status);
    });
  });

  feed.querySelectorAll('.report').forEach(el => {
    el.addEventListener('click', () => {
      const d = detections.find(x => x.id === el.dataset.id);
      if (d) {
        map.setView([d.latitude, d.longitude], 16);
        markers[d.id]?.openPopup();
      }
    });
  });
}

function render() {
  renderMarkers(detections);
  renderFeed(detections);
}

/* ============================================================
   POLLING LOOP
   ============================================================ */
async function refresh() {
  try {
    const [data, stats] = await Promise.all([fetchDetections(), fetchStats()]);
    detections = data;
    demoMode = false;
    document.getElementById('conn-dot').className = 'dot live';
    document.getElementById('conn-text').textContent = 'Live — connected to backend';
    renderStats(stats);
    render();
  } catch (err) {
    if (!demoMode) {
      // First failure: switch to demo dataset so the dashboard is still explorable.
      demoMode = true;
      detections = generateDemoData();
      document.getElementById('conn-dot').className = 'dot demo';
      document.getElementById('conn-text').textContent = `Demo data — backend not reachable at ${API_BASE}`;
      renderStats(computeDemoStats(detections));
      render();
    }
  }
}

document.getElementById('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.sev;
  render();
});

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
</script>
</body>
</html>
